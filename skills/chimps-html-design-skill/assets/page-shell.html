<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report title</title>
    <style>
      /* Palette: paste assets/palette.css here, verbatim, or the resolved
         client palette that replaced it. Nothing below hard-codes a colour. */

      body {
        margin: 0;
        background: var(--surface);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      .page {
        max-width: 60rem;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 0.25rem;
      }
      h2 {
        font-size: 1.125rem;
        margin: 2.5rem 0 0.5rem;
      }
      header p,
      figcaption,
      .note {
        color: var(--ink-secondary);
        font-size: 0.875rem;
      }
      figure {
        margin: 0 0 2rem;
      }
      .chart {
        width: 100%;
        height: 22rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: start;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--rule);
      }
      .num {
        text-align: end;
      }

      /* RTL: logical properties do the work, so only the exceptions live here. */
      [dir="rtl"] body {
        font-family:
          "Segoe UI", "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif;
      }

      @media print {
        figure,
        table {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Report title</h1>
        <p>
          Client name and date, then the scope of the report in one sentence
        </p>
      </header>

      <main>
        <h2>Section heading</h2>
        <figure>
          <div class="chart" id="chart-1"></div>
          <figcaption>
            What the chart says, as a sentence, not a restatement of the axes
          </figcaption>
        </figure>
      </main>

      <p class="note">Source and method note</p>
    </div>

    <!-- Paste the full contents of echarts.min.js between these tags. -->
    <script></script>

    <script>
      // Data, inlined: keep it here and keep rendering code below it.
      // Paste JSON with every "<" written as \u003c, for example from Python
      // json.dumps(data).replace("<", "\\u003c"), so a client string holding
      // a closing script tag cannot end this script.
      const data = { categories: [], series: [] };

      const root = document.documentElement;
      const token = (n) => getComputedStyle(root).getPropertyValue(n).trim();
      const chart = echarts.init(document.getElementById("chart-1"), null, {
        renderer: "svg",
      });
      chart.setOption({
        // Slots in order, never cycled: see references/charts.md
        color: [1, 2, 3, 4, 5, 6, 7, 8].map((slot) => token(`--cat-${slot}`)),
        textStyle: { fontFamily: getComputedStyle(document.body).fontFamily },
        xAxis: { type: "category", data: data.categories },
        yAxis: { type: "value" },
        series: data.series,
      });
      addEventListener("resize", () => chart.resize());
    </script>
  </body>
</html>
