name: Publish packages

on:
  push:
    branches:
      - main
    paths:
      - "packages/*/package.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository and package tarballs
        run: pnpm check

      # Built and smoke-tested BEFORE publishing so a broken bundle
      # configuration fails the run while nothing has reached npm yet,
      # instead of leaving a published version without its release asset.
      - name: Build and smoke-test the standalone CLI bundle
        run: |
          pnpm bundle:cli
          node packages/cli/dist-bundle/consultchimps.mjs --version

      - name: Configure release Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish unpublished package versions
        run: pnpm release

      - name: Push release tags
        run: git push origin --tags

      # Agents and locked-down environments can fetch one file instead of
      # resolving packages: the standalone bundle compiles every runtime
      # dependency into a single consultchimps.mjs that runs on Node 22+.
      # Uploads only when the CLI tag points at THIS commit — i.e. this run's
      # publish created it — so a manifest-only push can never attach a
      # bundle built from newer source to an older version's release.
      - name: Attach the standalone CLI bundle to its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          tag="consultchimps@${version}"
          tag_commit="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
          if [ -n "${tag_commit}" ] && [ "${tag_commit}" = "$(git rev-parse HEAD)" ]; then
            gh release create "${tag}" --verify-tag --title "${tag}" \
              --notes "Standalone CLI: download consultchimps.mjs and run \`node consultchimps.mjs --help\` on Node.js 22 or later — no npm access required. Changelog: https://github.com/consultchimps/consultchimps/blob/main/packages/cli/CHANGELOG.md" \
              || true
            gh release upload "${tag}" packages/cli/dist-bundle/consultchimps.mjs --clobber
          else
            echo "No CLI release was published from this commit; skipping the bundle upload."
          fi
