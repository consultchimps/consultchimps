name: Publish packages

on:
  push:
    branches:
      - main
    paths:
      - "packages/*/package.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  portable:
    name: Portable CLI (${{ matrix.os }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bundle:cli
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.os }}
          path: packages/cli/dist-archives/*.zip
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: portable
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository and package tarballs
        run: pnpm check

      - name: Download verified portable CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          path: portable-archives
          merge-multiple: true

      - name: Configure release Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish unpublished package versions
        run: pnpm release

      - name: Push release tags
        run: git push origin --tags

      # Attach assets only to a CLI release created from this source revision.
      - name: Attach portable CLI archives to their release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          tag="consultchimps@${version}"
          tag_commit="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
          if [ -n "${tag_commit}" ] && [ "${tag_commit}" = "$(git rev-parse HEAD)" ]; then
            # The single-file CLI is the same in every archive; it runs every
            # document command with Node alone (the database engines load only
            # when a database opens), and the skills and the skills reference
            # check download it by this name. Its license notices travel beside
            # it, taken from the same archive.
            archive="$(ls portable-archives/consultchimps-linux-x64-*.zip | head -n 1)"
            standalone="$(mktemp -d)"
            unzip -q "${archive}" consultchimps.mjs LICENSE THIRD-PARTY-LICENSES.md 'LICENSES/*' -d "${standalone}"
            cp "${standalone}/consultchimps.mjs" consultchimps.mjs
            (cd "${standalone}" && zip -qr "${GITHUB_WORKSPACE}/consultchimps-licenses.zip" LICENSE THIRD-PARTY-LICENSES.md LICENSES)
            assets=(portable-archives/*.zip consultchimps.mjs consultchimps-licenses.zip)
            # Created with every asset in one call, which keeps the release a
            # draft until the uploads finish; a rerun replaces the assets.
            if gh release view "${tag}" >/dev/null 2>&1; then
              gh release upload "${tag}" "${assets[@]}" --clobber
              # A release left as a draft by an interrupted create is published
              # once its assets are in place; this does nothing to one already
              # published.
              gh release edit "${tag}" --draft=false
            else
              gh release create "${tag}" --verify-tag --title "${tag}" \
                --notes "Portable CLI: download the archive matching your operating system and architecture, extract it, and run \`node consultchimps.mjs --help\` on Node.js 24. Keep its node_modules directory beside the executable. No npm access is required on the destination machine. consultchimps.mjs on its own runs every document command with Node alone; its license notices are in consultchimps-licenses.zip. Changelog: https://github.com/consultchimps/consultchimps/blob/main/packages/cli/CHANGELOG.md" \
                "${assets[@]}"
            fi
          else
            echo "No CLI release was published from this commit; skipping the bundle upload."
          fi
