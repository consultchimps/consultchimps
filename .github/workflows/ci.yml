name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, build, types, and tests
        run: pnpm check

  # Aggregates the matrix into the single "Check" status that branch
  # protection requires; it fails unless every operating system passed.
  check:
    name: Check
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm every operating system passed
        run: test "${{ needs.verify.result }}" = "success"
