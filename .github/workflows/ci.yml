name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress.
# Pushes to main get a group per commit, so they never cancel or queue
# behind each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything platform-neutral runs once, on Linux: formatting, lint, the
  # package and documentation builds, types, and the portable CLI archive.
  # The built output is uploaded so every test job verifies the same
  # JavaScript that ships; build output does not depend on the operating
  # system or Node line that produced it.
  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Next.js keeps its webpack cache under .next/cache; restoring it turns
      # the documentation build into an incremental one.
      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/docs/.next/cache
          key:
            nextjs-ci-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('apps/docs/src/**', 'apps/docs/content/**',
            'apps/docs/*.ts', 'apps/docs/*.mjs', 'apps/docs/*.json') }}
          restore-keys: |
            nextjs-ci-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build packages and the documentation site
        run: pnpm build

      - name: Check types
        run: pnpm typecheck

      - name: Build and verify the portable CLI archive
        run: pnpm bundle:cli

      # Guard the artifact layout: with several path globs the artifact root
      # is their common ancestor, so a missing docs export would silently
      # shift every path instead of failing here.
      - name: Confirm the documentation export exists
        run: test -f apps/docs/out/index.html

      # apps/docs/public/database-wasm is written by the docs build and read
      # directly by the browser suite, so it travels with the export.
      - name: Upload the built output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            apps/docs/out
            apps/docs/public/database-wasm
          if-no-files-found: error
          retention-days: 1

  # The test suites run against the uploaded build on the development Node
  # line. Linux also carries coverage enforcement and the platform-neutral
  # package and documentation checks; Windows additionally proves the
  # portable archive builds there, since the publish workflow ships one.
  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-4vcpu-windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the built output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Run the test suites with coverage
        if: runner.os == 'Linux'
        run: pnpm test:coverage

      - name: Check package tarballs and documentation
        if: runner.os == 'Linux'
        run: pnpm package:check && pnpm docs:check

      - name: Run the test suites
        if: runner.os == 'Windows'
        run: pnpm test:run

      - name: Build and verify the portable CLI archive
        if: runner.os == 'Windows'
        run: pnpm bundle:cli

  # The published runtime contract (engines.node >=22.13.0) is validated on
  # every push to main: the declared floor and the next Node line each run
  # the test suites against the same build. Drop the 22 leg around Node 22's
  # April 2027 end of life.
  runtime:
    name: Runtime (Node ${{ matrix.node }})
    needs: build
    if: github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "26"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the built output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Run the test suites on this Node line
        run: pnpm test:run

  # Browser smoke tests for the in-browser tool pages. They run against the
  # static export exactly as GitHub Pages serves it, so they need a real
  # browser and only run on Linux; the operations underneath are covered
  # cross-platform by the unit suites in `test`.
  e2e:
    name: Browser tools
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: |
          manifest="apps/docs/node_modules/@playwright/test/package.json"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('${manifest}', 'utf8')).version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key:
            playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run:
          pnpm --filter @consultchimps/docs exec playwright install chromium
          --with-deps

      # The build job exports the site without NEXT_PUBLIC_BASE_PATH, so it
      # serves from "/", which is what the suite's static server and the
      # tests assume. The CLI build is used by the file interchange tests.
      - name: Download the built output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Run the browser smoke tests
        run: pnpm --filter @consultchimps/docs e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/docs/playwright-report
          retention-days: 7

  # Aggregates every job into the single "Check" status that branch
  # protection requires; it fails unless every job that ran passed. The
  # runtime legs only run on main, so "skipped" counts as passed for them.
  check:
    name: Check
    needs: [build, test, runtime, e2e]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Confirm the build passed
        run: test "${{ needs.build.result }}" = "success"

      - name: Confirm every operating system passed
        run: test "${{ needs.test.result }}" = "success"

      - name: Confirm the Node runtime legs passed or were not required
        run: |
          test "${{ needs.runtime.result }}" = "success" ||
            test "${{ needs.runtime.result }}" = "skipped"

      - name: Confirm the browser smoke tests passed
        run: test "${{ needs.e2e.result }}" = "success"
