name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach confidential client files. Create a minimal anonymized reproduction instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description:
        Include the command, anonymized fixture, or minimal code needed to
        reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ConsultChimps version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version
    validations:
      required: true
